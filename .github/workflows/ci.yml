name: CI

on:
  push:
  pull_request:

# 最小权限：CI 只需读代码（防止被投毒的工作流拿到写权限）
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mbptest
          POSTGRES_USER: mbp
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U mbp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # 必须更新 registry 索引再构建 —— 刚装好的工具链带的是安装时的旧索引，
      # 会报 `Failed to resolve registry dependency moonbitlang/async: module was not found in the registry`，
      # 整个 CI 从这一步就红（日志里自己也提示了 "you may need to run moon update"）。
      - name: moon update (refresh registry)
        run: moon update

      - name: moon version
        run: moon version

      - name: Check (deny warnings)
        run: moon check --deny-warn --target native

      - name: Test (native)
        run: moon test --target native

      - name: Test (wasm-gc, protocol layer)
        run: moon test --target wasm-gc

      # 桌面 IDE 的**纯逻辑**测试（不需要 Electron、不需要显示环境）—— 能在 Linux CI 上跑。
      # 只挂当前确实能过的：先跑一遍确认“绿”，再放进来；宁缺勿滥（红的 CI 比不挂更糟）。
      # 交互层（真点击）的那批 verify-*.js 依赖 Windows 路径与显示环境，**不能**进这个 CI ——
      # 它们的防线是演示前本地跑 `cd desktop && npm run verify:desktop`。
      # 禁止「新增空 catch」（冻结存量）—— 更值钱的不是修那三处，而是防第四次：
      # 空 catch 会把「读取失败」静默变成「没有数据」，本轮已因此踩坑三次。
      - name: No new empty catch
        run: node tools/check-empty-catch.js --ci

      - name: Desktop IDE logic tests
        run: |
          cd desktop
          node test-runner-detect.js     # 项目类型识别 / 运行入口（输入→输出）
          node test-project-detect.js    # 项目类型识别（另一套口径）
          node test-relay.js             # 文件中转站核心逻辑
