name: CI

on:
  push:
  pull_request:

# 最小权限：CI 只需读代码（防止被投毒的工作流拿到写权限）
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mbptest
          POSTGRES_USER: mbp
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U mbp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # 必须更新 registry 索引再构建 —— 刚装好的工具链带的是安装时的旧索引，
      # 会报 `Failed to resolve registry dependency moonbitlang/async: module was not found in the registry`，
      # 整个 CI 从这一步就红（日志里自己也提示了 "you may need to run moon update"）。
      - name: moon update (refresh registry)
        run: moon update

      - name: moon version
        run: moon version

      # 用 `moon check` 而**不是** `moon check --deny-warn`。
      # 原因（踩过）：CI 装的是 latest、开发机可能是另一个版本，而新版会不断新增警告
      # （0079 derive 隐式提升、0025 测试代码风格…）—— 那些是**工具链的版本差异**，
      # 不是我们的代码有问题，但 `--deny-warn` 会把它们当 error，于是
      # **本地全绿、CI 全红**，而且修完一个又冒一个（我连追了三个提交）。
      # 分工：CI 只拦**真错误**（error）；警告由开发机上的 `moon check --deny-warn` 自查。
      - name: Check
        run: moon check --target native

      - name: Test (native)
        run: moon test --target native

      - name: Test (wasm-gc, protocol layer)
        run: moon test --target wasm-gc

      # 桌面 IDE 的**纯逻辑**测试（不需要 Electron、不需要显示环境）—— 能在 Linux CI 上跑。
      # 只挂当前确实能过的：先跑一遍确认“绿”，再放进来；宁缺勿滥（红的 CI 比不挂更糟）。
      # 交互层（真点击）的那批 verify-*.js 依赖 Windows 路径与显示环境，**不能**进这个 CI ——
      # 它们的防线是演示前本地跑 `cd desktop && npm run verify:desktop`。
      # 禁止「新增空 catch」（冻结存量）—— 更值钱的不是修那三处，而是防第四次：
      # 空 catch 会把「读取失败」静默变成「没有数据」，本轮已因此踩坑三次。
      - name: No new empty catch
        run: node tools/check-empty-catch.js --ci

      - name: Desktop IDE logic tests
        run: |
          cd desktop
          node test-runner-detect.js     # 项目类型识别 / 运行入口（输入→输出）
          node test-project-detect.js    # 项目类型识别（另一套口径）
          node test-relay.js             # 文件中转站核心逻辑
          node test-url-detect.js        # URL 检测（含「正则在生产代码里只有一处实现」的防漂移断言）
          node test-run-state.js         # Run 生命周期原语（状态枚举/转换/ProcessHandle/RunResult）
          node test-project-context.js   # 单一工程上下文（类型归一/命令推导/无项目态/多项目判定）

      # Run 链路 E2E：spawn → 抓 URL → 打开浏览器（测试里注入桩）→ 页面可访问 → 停止。
      # 靶子是纯 Node 服务（desktop/testdata/fixture-http-server.js）—— **不需要 Electron、
      # 不需要 MoonBit native 构建**，所以 Linux CI 能跑。
      # 这条链路此前只有本机 verify-run-url.js 覆盖，而本机 MoonBit 工具链一坏就再也验不了（红灯 R12）。
      - name: Run E2E (pure Node)
        run: |
          cd desktop
          node test-run-e2e.js
