# Nginx 反向代理：TLS 终止 + 负载均衡到本机多个 Conduit 实例
#
# 用法见 deploy/README.md。
#
# 关键点：
#   - 8090 端口仅做 HTTP → HTTPS 跳转（301）
#   - 8443 端口终止 TLS，再以明文转发到后端实例（内网回源）
#   - upstream 指向宿主机端口（Docker Desktop 提供 host.docker.internal）
#   - 转发 X-Real-IP / X-Forwarded-For / X-Forwarded-Proto，配合服务端
#     MBP_TRUST_PROXY=1 让限流按「真实客户端 IP」计数

worker_processes 1;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
}

http {
    access_log /var/log/nginx/access.log;

    # 后端实例池
    upstream conduit_backend {
        server host.docker.internal:8101 max_fails=3 fail_timeout=5s;
        server host.docker.internal:8102 max_fails=3 fail_timeout=5s;
        server host.docker.internal:8103 max_fails=3 fail_timeout=5s;
        keepalive 32;
    }

    # ---- HTTP：只做跳转，不承载业务 ----
    server {
        listen 8090;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }

    # ---- HTTPS：TLS 终止 + 反向代理 ----
    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        # 证书（自签，仅用于本机验证；生产请换成受信任证书）
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # 协议与套件加固
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;

        # 安全响应头
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # 请求体上限（Conduit 文章正文）
        client_max_body_size 4m;

        location / {
            proxy_pass http://conduit_backend;
            proxy_http_version 1.1;
            # keepalive 到后端必须清空 Connection 头
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 应用据此判断外部是 HTTPS
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }
    }
}
